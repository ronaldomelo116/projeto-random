<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Sorteio</title>
  <meta name="description" content="Sorteie números de forma fácil e segura! Defina seu intervalo mínimo e máximo e deixe o DevSorteio cuidar do resto com uma interface responsiva e animada." />
  <link rel="stylesheet" href="style.css" class="css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
</head>

<body>
  <header>
    <img src="assets/img/logo.png" alt="logo Dev Sorteio" />
  </header>
  <main>
    <h1 id="status-message">Sortear um número</h1>

    <div class="container-input">
      <input class="min-input" type="number" placeholder="entre" />
      <input class="max-input" type="number" placeholder="e" />
    </div>

    <button onclick="numberGenerator()">Sortear</button>
  </main>

  <footer class="rodape">
        <p>&copy; 2026 Dev Sorteio</p>
        <p>Desenvolvido por <span>Ronaldo Mello</span></p>
    </footer>


  <script src="script.js"></script>
</body>

</html>
